services:
  - type: web
    name: aegis-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: HF_SIM_MODEL
        value: stabilityai/sd-turbo
      - key: FRONTEND_ORIGINS
        value: http://localhost:3000
      - key: GROQ_API_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false